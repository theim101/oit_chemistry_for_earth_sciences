version: 1
project:
    id: 9d71ac75-08c4-462d-bcd7-f76e3de51961
    title: Template Chemistry in Earth Sciences
    authors:
        - name: Timo Heimovaara
    copyright: Delft University of Technology, CC BY 4.0
    license: CC-BY-4.0
    open_access: true
    github: theim101/oit_chemistry_for_earth_sciences
    thebe:
      server:
        url: http://localhost:8890/
        token: abcd1234
      thebe:
        codeMirrorConfig:
          theme: "yeti" # or "default"
    exclude:
        - _build
        - pyorchestra
        - Thumbs.db
        - .DS_Store
        - '**.ipynb_checkpoints'
        - .git
        - .virtual_documents
    bibliography:
        - references.bib
    exports:
        - format: pdf
        - format: tex
          template: volcanica #plain_latex_book
          article_type: Report
          output: exports/book.zip
        - format: md
