execute:
  execute_notebooks: "auto"
# Enable Theebe
launch_buttons:
  thebe: true
  notebook_interface: "jupyterlab"

thebe_config:
  use_thebe: true
  useBinder: false
  useJupyterLite: false
  codeMirrorConfig:
    theme: "default"
  mountActivateWidget: true
  mountStatusWidget: true
  serverSettings:
    baseUrl: "http://localhost:8890"
    token: "abcd1234"
    appendToken: true
  kernelOptions:
    name: "python3"

